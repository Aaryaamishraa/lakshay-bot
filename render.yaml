services:
  - type: web
    name: lakshay-bot
    runtime: python
    plan: starter            # free plan sleeps after 15 min idle and loses in-memory state
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn lakshay.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /v1/healthz
    envVars:
      - key: TEAM_NAME
        value: Arya Mishra
      - key: TEAM_MEMBERS
        value: Arya Mishra
      - key: CONTACT_EMAIL
        value: 
      - key: ANTHROPIC_API_KEY   # optional — leave unset for the deterministic FAQ matcher
        sync: false
